[project]
name = "fastapi-fullstack-webapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan-hash", email = "karankaushal907@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
fastapi-fullstack-webapp = "fastapi_fullstack_webapp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
